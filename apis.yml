name: Synchron
description: >-
  Synchron is a clinical-stage neurotechnology company developing an implantable
  brain-computer interface (BCI). Its flagship device, the Stentrode, is placed
  in a blood vessel near the motor cortex through a minimally invasive endovascular
  procedure (via the jugular vein) rather than open brain surgery, letting people
  with paralysis control digital devices with their thoughts. Synchron has
  co-developed a Bluetooth-based interface aligned with Apple's BCI-HID protocol,
  connecting brain signals to iPhone, iPad, and Vision Pro through Switch Control,
  and runs a Cognitive AI division decoding neural data in real time. The Stentrode
  is an investigational device under FDA and TGA clinical trials and is not yet
  commercially approved. Synchron publishes no public developer API, SDK, or
  documentation surface; this profile captures its corporate identity and probed
  domain-security posture.
